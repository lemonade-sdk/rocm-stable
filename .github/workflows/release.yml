name: Build and Release ROCm SDK Bundle

on:
  push:
    tags:
      - 'v*'
      - 'b*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release (false = artifacts only for testing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ROCm SDK Package
    runs-on: ubuntu-latest

    outputs:
      rocm_version: ${{ steps.ver.outputs.rocm_version }}
      bundle_name: ${{ steps.ver.outputs.bundle_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "After cleanup:"
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils zstd

      - name: Read ROCm version from build.sh
        id: ver
        run: |
          rocm_version=$(grep '^ROCM_VERSION=' build.sh | cut -d'"' -f2)
          bundle_name="rocm-${rocm_version}-runtime-libs.tar.gz"
          echo "rocm_version=${rocm_version}" >> $GITHUB_OUTPUT
          echo "bundle_name=${bundle_name}" >> $GITHUB_OUTPUT
          echo "ROCm version: ${rocm_version}"
          echo "Bundle name: ${bundle_name}"

      - name: Build ROCm SDK bundle
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify package was created
        run: |
          bundle="${{ steps.ver.outputs.bundle_name }}"
          if [ ! -f "${bundle}" ]; then
            echo "Error: ${bundle} not found!"
            exit 1
          fi
          echo "Package size: $(du -h ${bundle} | cut -f1)"
          echo "Package created successfully"

      - name: Generate checksums
        run: |
          bundle="${{ steps.ver.outputs.bundle_name }}"
          sha256sum "${bundle}" > "${bundle}.sha256"
          cat "${bundle}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocm-runtime-bundle
          path: |
            ${{ steps.ver.outputs.bundle_name }}
            ${{ steps.ver.outputs.bundle_name }}.sha256
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rocm-runtime-bundle

      - name: Extract version from tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "Building release for version: ${GITHUB_REF#refs/tags/}"

      - name: Create release notes
        id: release_notes
        env:
          ROCM_VERSION: ${{ needs.build.outputs.rocm_version }}
          BUNDLE: ${{ needs.build.outputs.bundle_name }}
        run: |
          cat > release_notes.md << EOF
          # ROCm ${ROCM_VERSION} SDK Bundle

          A standalone bundle of the ROCm ${ROCM_VERSION} SDK — compiler, headers,
          cmake configs, and runtime libraries — pulled from
          https://repo.radeon.com/rocm/apt/${ROCM_VERSION}/ and laid out as a
          drop-in replacement for \`/opt/rocm\`. Use it to build and run
          HIP-enabled applications without installing ROCm system-wide.

          ## What's included

          ### Compiler toolchain
          - \`amdclang\` / \`amdclang++\` (HIP-aware Clang driver)
          - \`hipcc\` driver wrapper
          - rocm-llvm, rocm-device-libs, rocm-cmake

          ### HIP runtime + headers
          - libamdhip64 + \`include/hip/\`
          - libhsa-runtime64 + \`include/hsa/\`
          - hipconfig, rocminfo, rocm-smi

          ### Math libraries (runtime + dev headers)
          - rocBLAS, hipBLAS, hipBLASLt
          - rocSPARSE, hipSPARSE
          - rocSOLVER, hipSOLVER
          - rocRAND, hipRAND

          ### Template libraries (header-only)
          - rocPRIM, rocThrust, hipCUB, rocWMMA

          ### GPU kernel files (filtered to supported targets)
          - rocBLAS Tensile kernels
          - hipBLASLt kernels
          - composable-kernel

          ## System requirements

          - AMD GPU with ROCm support
          - Linux with AMDGPU driver
          - No system ROCm installation required

          ## Quick start

          \`\`\`bash
          # Download
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${BUNDLE}

          # Extract to /opt/rocm
          sudo mkdir -p /opt/rocm
          sudo tar -xzf ${BUNDLE} -C /opt/rocm

          # Verify the compiler
          /opt/rocm/bin/amdclang --version
          \`\`\`

          ## Verification

          **SHA256 Checksum:**
          \`\`\`
          \$(cat ${BUNDLE}.sha256)
          \`\`\`

          \`\`\`bash
          sha256sum -c ${BUNDLE}.sha256
          \`\`\`

          ## License

          ROCm libraries are licensed under MIT and Apache 2.0 licenses by AMD.

          ---

          **Note:** This is an unofficial redistribution of the ROCm SDK for
          convenience. For official ROCm releases, visit:
          https://github.com/RadeonOpenCompute/ROCm
          EOF

          echo "Release notes generated"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ROCm ${{ needs.build.outputs.rocm_version }} SDK Bundle ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          files: |
            ${{ needs.build.outputs.bundle_name }}
            ${{ needs.build.outputs.bundle_name }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
