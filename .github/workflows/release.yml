name: Build and Release ROCm SDK Bundle

on:
  push:
    tags:
      - 'v*'
      - 'b*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release (false = artifacts only for testing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ROCm SDK Package
    runs-on: ubuntu-latest

    outputs:
      rocm_version: ${{ steps.ver.outputs.rocm_version }}
      runtime_bundle: ${{ steps.ver.outputs.runtime_bundle }}
      sdk_compiler: ${{ steps.ver.outputs.sdk_compiler }}
      sdk_device_libs: ${{ steps.ver.outputs.sdk_device_libs }}
      sdk_core_libs: ${{ steps.ver.outputs.sdk_core_libs }}
      sdk_blas: ${{ steps.ver.outputs.sdk_blas }}
      sdk_math: ${{ steps.ver.outputs.sdk_math }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "After cleanup:"
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils zstd

      - name: Read ROCm version from build.sh
        id: ver
        run: |
          rocm_version=$(grep '^ROCM_VERSION=' build.sh | cut -d'"' -f2)
          runtime_bundle="rocm-${rocm_version}-runtime-libs.tar.gz"
          sdk_compiler="rocm-${rocm_version}-sdk-compiler.tar.gz"
          sdk_device_libs="rocm-${rocm_version}-sdk-device-libs.tar.gz"
          sdk_core_libs="rocm-${rocm_version}-sdk-core-libs.tar.gz"
          sdk_blas="rocm-${rocm_version}-sdk-blas.tar.gz"
          sdk_math="rocm-${rocm_version}-sdk-math.tar.gz"
          echo "rocm_version=${rocm_version}" >> $GITHUB_OUTPUT
          echo "runtime_bundle=${runtime_bundle}" >> $GITHUB_OUTPUT
          echo "sdk_compiler=${sdk_compiler}" >> $GITHUB_OUTPUT
          echo "sdk_device_libs=${sdk_device_libs}" >> $GITHUB_OUTPUT
          echo "sdk_core_libs=${sdk_core_libs}" >> $GITHUB_OUTPUT
          echo "sdk_blas=${sdk_blas}" >> $GITHUB_OUTPUT
          echo "sdk_math=${sdk_math}" >> $GITHUB_OUTPUT
          echo "ROCm version:      ${rocm_version}"
          echo "Runtime bundle:    ${runtime_bundle}"
          echo "SDK compiler:      ${sdk_compiler}"
          echo "SDK core libs:     ${sdk_core_libs}"
          echo "SDK device libs:   ${sdk_device_libs}"
          echo "SDK blas:          ${sdk_blas}"
          echo "SDK math:          ${sdk_math}"

      - name: Build ROCm runtime + SDK bundles
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify packages were created
        run: |
          runtime="${{ steps.ver.outputs.runtime_bundle }}"
          compiler="${{ steps.ver.outputs.sdk_compiler }}"
          device_libs="${{ steps.ver.outputs.sdk_device_libs }}"
          core_libs="${{ steps.ver.outputs.sdk_core_libs }}"
          blas="${{ steps.ver.outputs.sdk_blas }}"
          math="${{ steps.ver.outputs.sdk_math }}"
          for bundle in "${runtime}" "${compiler}" "${device_libs}" "${core_libs}" "${blas}" "${math}"; do
            if [ ! -f "${bundle}" ]; then
              echo "Error: ${bundle} not found!"
              exit 1
            fi
            echo "Package size: $(du -h ${bundle} | cut -f1) (${bundle})"
          done
          echo "Packages created successfully"

      - name: Generate checksums
        run: |
          runtime="${{ steps.ver.outputs.runtime_bundle }}"
          compiler="${{ steps.ver.outputs.sdk_compiler }}"
          device_libs="${{ steps.ver.outputs.sdk_device_libs }}"
          core_libs="${{ steps.ver.outputs.sdk_core_libs }}"
          blas="${{ steps.ver.outputs.sdk_blas }}"
          math="${{ steps.ver.outputs.sdk_math }}"
          sha256sum "${runtime}"     > "${runtime}.sha256"
          sha256sum "${compiler}"    > "${compiler}.sha256"
          sha256sum "${device_libs}" > "${device_libs}.sha256"
          sha256sum "${core_libs}"   > "${core_libs}.sha256"
          sha256sum "${blas}"        > "${blas}.sha256"
          sha256sum "${math}"        > "${math}.sha256"
          cat "${runtime}.sha256" "${compiler}.sha256" "${device_libs}.sha256" "${core_libs}.sha256" "${blas}.sha256" "${math}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocm-bundles
          path: |
            ${{ steps.ver.outputs.runtime_bundle }}
            ${{ steps.ver.outputs.runtime_bundle }}.sha256
            ${{ steps.ver.outputs.sdk_compiler }}
            ${{ steps.ver.outputs.sdk_compiler }}.sha256
            ${{ steps.ver.outputs.sdk_device_libs }}
            ${{ steps.ver.outputs.sdk_device_libs }}.sha256
            ${{ steps.ver.outputs.sdk_core_libs }}
            ${{ steps.ver.outputs.sdk_core_libs }}.sha256
            ${{ steps.ver.outputs.sdk_blas }}
            ${{ steps.ver.outputs.sdk_blas }}.sha256
            ${{ steps.ver.outputs.sdk_math }}
            ${{ steps.ver.outputs.sdk_math }}.sha256
          retention-days: 5

  verify:
    name: Verify ROCm Bundles
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rocm-bundles

      - name: Report bundle sizes
        run: |
          runtime="${{ needs.build.outputs.runtime_bundle }}"
          compiler="${{ needs.build.outputs.sdk_compiler }}"
          device_libs="${{ needs.build.outputs.sdk_device_libs }}"
          core_libs="${{ needs.build.outputs.sdk_core_libs }}"
          blas="${{ needs.build.outputs.sdk_blas }}"
          math="${{ needs.build.outputs.sdk_math }}"

          runtime_bytes=$(stat -c%s "${runtime}")
          compiler_bytes=$(stat -c%s "${compiler}")
          device_libs_bytes=$(stat -c%s "${device_libs}")
          core_libs_bytes=$(stat -c%s "${core_libs}")
          blas_bytes=$(stat -c%s "${blas}")
          math_bytes=$(stat -c%s "${math}")

          echo "Runtime:       $(numfmt --to=iec "${runtime_bytes}") (${runtime_bytes} bytes)"
          echo "SDK compiler:  $(numfmt --to=iec "${compiler_bytes}") (${compiler_bytes} bytes)"
          echo "SDK dev-libs:  $(numfmt --to=iec "${device_libs_bytes}") (${device_libs_bytes} bytes)"
          echo "SDK core libs: $(numfmt --to=iec "${core_libs_bytes}") (${core_libs_bytes} bytes)"
          echo "SDK blas:      $(numfmt --to=iec "${blas_bytes}") (${blas_bytes} bytes)"
          echo "SDK math:      $(numfmt --to=iec "${math_bytes}") (${math_bytes} bytes)"
          echo "SDK total:     $(numfmt --to=iec $((compiler_bytes + device_libs_bytes + core_libs_bytes + blas_bytes + math_bytes)))"

          # Size gate: 2 GiB per-asset limit
          limit=$((2 * 1024 * 1024 * 1024))
          for name in "Runtime:${runtime}:${runtime_bytes}" "Compiler:${compiler}:${compiler_bytes}" "Device-libs:${device_libs}:${device_libs_bytes}" "Core-libs:${core_libs}:${core_libs_bytes}" "BLAS:${blas}:${blas_bytes}" "Math:${math}:${math_bytes}"; do
            IFS=: read -r label path bytes <<< "${name}"
            if [ "${bytes}" -gt "${limit}" ]; then
              echo "::error::${label} exceeds 2 GiB limit: $(numfmt --to=iec "${bytes}")"
              exit 1
            fi
            echo "  ${label}: $(numfmt --to=iec "${bytes}") -- within 2 GiB limit"
          done

      - name: Verify checksums
        run: |
          runtime="${{ needs.build.outputs.runtime_bundle }}"
          compiler="${{ needs.build.outputs.sdk_compiler }}"
          device_libs="${{ needs.build.outputs.sdk_device_libs }}"
          core_libs="${{ needs.build.outputs.sdk_core_libs }}"
          blas="${{ needs.build.outputs.sdk_blas }}"
          math="${{ needs.build.outputs.sdk_math }}"
          sha256sum -c "${runtime}.sha256"
          sha256sum -c "${compiler}.sha256"
          sha256sum -c "${device_libs}.sha256"
          sha256sum -c "${core_libs}.sha256"
          sha256sum -c "${blas}.sha256"
          sha256sum -c "${math}.sha256"

      - name: Check no duplicate files across SDK artifacts
        run: |
          compiler="${{ needs.build.outputs.sdk_compiler }}"
          device_libs="${{ needs.build.outputs.sdk_device_libs }}"
          core_libs="${{ needs.build.outputs.sdk_core_libs }}"
          blas="${{ needs.build.outputs.sdk_blas }}"
          math="${{ needs.build.outputs.sdk_math }}"

          tmp_co=$(mktemp -d)
          tmp_dl=$(mktemp -d)
          tmp_cl=$(mktemp -d)
          tmp_bl=$(mktemp -d)
          tmp_ma=$(mktemp -d)

          tar -xzf "${compiler}"   -C "${tmp_co}"
          tar -xzf "${device_libs}" -C "${tmp_dl}"
          tar -xzf "${core_libs}"  -C "${tmp_cl}"
          tar -xzf "${blas}"       -C "${tmp_bl}"
          tar -xzf "${math}"       -C "${tmp_ma}"

          (cd "${tmp_co}" && find . -type f | sort) > /tmp/files_co.txt
          (cd "${tmp_dl}" && find . -type f | sort) > /tmp/files_dl.txt
          (cd "${tmp_cl}" && find . -type f | sort) > /tmp/files_cl.txt
          (cd "${tmp_bl}" && find . -type f | sort) > /tmp/files_bl.txt
          (cd "${tmp_ma}" && find . -type f | sort) > /tmp/files_ma.txt

          has_dup=false
          for pair in "co:dl:compiler<->dev-libs" "co:cl:compiler<->core-libs" "co:bl:compiler<->blas" "co:ma:compiler<->math" "dl:cl:dev-libs<->core-libs" "dl:bl:dev-libs<->blas" "dl:ma:dev-libs<->math" "cl:bl:core-libs<->blas" "cl:ma:core-libs<->math" "bl:ma:blas<->math"; do
            IFS=: read -r a b label <<< "${pair}"
            dup=$(comm -12 "/tmp/files_${a}.txt" "/tmp/files_${b}.txt")
            if [ -n "${dup}" ]; then
              echo "::error::Duplicate files between ${label}:"
              echo "${dup}"
              has_dup=true
            fi
          done

          rm -rf "${tmp_co}" "${tmp_dl}" "${tmp_cl}" "${tmp_bl}" "${tmp_ma}"

          if [ "${has_dup}" = true ]; then
            exit 1
          fi
          echo "No duplicate files across SDK artifacts -- check passed."

      - name: ldd check -- runtime bundle
        run: |
          runtime="${{ needs.build.outputs.runtime_bundle }}"
          tmpdir=$(mktemp -d)
          tar -xzf "${runtime}" -C "${tmpdir}"

          libdir="${tmpdir}"
          export LD_LIBRARY_PATH="${libdir}:${LD_LIBRARY_PATH:-}"

          echo "Checking shared library dependencies..."
          missing=$(find "${libdir}" -name '*.so*' -type f -exec ldd {} \; 2>/dev/null \
            | grep 'not found' \
            | grep -v -E 'libc\.so|libstdc\+\+\.so|libm\.so|libdl\.so|libpthread|librt\.so|libgcc_s\.so|ld-linux|libz\.so|liblzma\.so|libdrm\.so|libnuma\.so|libelf\.so' \
            || true)

          if [ -n "${missing}" ]; then
            echo "::error::Missing shared library dependencies detected:"
            echo "${missing}"
            exit 1
          fi
          echo "ldd check passed -- all runtime dependencies resolved."

          rm -rf "${tmpdir}"

  release:
    name: Create GitHub Release
    needs: [build, verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rocm-bundles

      - name: Determine release version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            ROCM="${{ needs.build.outputs.rocm_version }}"
            VERSION="v${ROCM}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Create release notes
        id: release_notes
        env:
          ROCM_VERSION: ${{ needs.build.outputs.rocm_version }}
          RUNTIME_BUNDLE: ${{ needs.build.outputs.runtime_bundle }}
          SDK_COMPILER: ${{ needs.build.outputs.sdk_compiler }}
          SDK_DEVICE_LIBS: ${{ needs.build.outputs.sdk_device_libs }}
          SDK_CORE_LIBS: ${{ needs.build.outputs.sdk_core_libs }}
          SDK_BLAS: ${{ needs.build.outputs.sdk_blas }}
          SDK_MATH: ${{ needs.build.outputs.sdk_math }}
        run: |
          cat > release_notes.md << EOF
          # ROCm ${ROCM_VERSION} Bundles

          Six modular ROCm ${ROCM_VERSION} bundles pulled from
          https://repo.radeon.com/rocm/apt/${ROCM_VERSION}/ and laid out as
          drop-in replacements for \`/opt/rocm\`. Extract to the same directory
          to overlay into a complete tree.

          | Bundle | File | Purpose |
          |--------|------|---------|
          | Runtime | \`${RUNTIME_BUNDLE}\` | Run HIP applications |
          | SDK Compiler | \`${SDK_COMPILER}\` | Compiler, headers, cmake, dev files |
          | SDK Device Libs | \`${SDK_DEVICE_LIBS}\` | Device library bitcode (.bc, .hsaco) |
          | SDK Core Libs | \`${SDK_CORE_LIBS}\` | HIP, HSA, LLVM shared libraries |
          | SDK BLAS | \`${SDK_BLAS}\` | rocBLAS, hipBLAS, hipBLASLt + Tensile kernels |
          | SDK Math | \`${SDK_MATH}\` | rocSPARSE, rocSOLVER, random libs, etc. |

          - **\`${RUNTIME_BUNDLE}\`** -- runtime libraries only. Use this to
            *run* HIP-enabled applications (e.g. llama.cpp ROCm builds).
          - **\`${SDK_COMPILER}\`** -- compiler toolchain, headers, cmake.
            Use this to *build* HIP code.
          - **\`${SDK_DEVICE_LIBS}\`** -- device library bitcode for RDNA GPUs.
            Required for GPU code compilation.
          - **\`${SDK_CORE_LIBS}\`** -- core shared libraries (HIP, HSA, LLVM).
            Required for compilation with rocBLAS/hipBLAS/etc.
          - **\`${SDK_BLAS}\`** -- BLAS libraries with Tensile kernels.
            Required for rocBLAS/hipBLAS/hipBLASLt workloads.
          - **\`${SDK_MATH}\`** -- sparse, solver, and random math libraries.
            Required for rocSPARSE/rocSOLVER/hipRAND workloads.

          Extract all needed bundles to the same directory to get the full tree.

          ## System requirements

          - AMD GPU with ROCm support
          - Linux with AMDGPU driver
          - No system ROCm installation required

          ## Quick start

          Runtime only (smaller download, run pre-built ROCm apps):

          \`\`\`bash
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${RUNTIME_BUNDLE}
          sudo mkdir -p /opt/rocm
          sudo tar -xzf ${RUNTIME_BUNDLE} -C /opt/rocm
          \`\`\`

          Full SDK (compile and run with all math libraries):

          \`\`\`bash
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${SDK_COMPILER}
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${SDK_DEVICE_LIBS}
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${SDK_CORE_LIBS}
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${SDK_BLAS}
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${SDK_MATH}
          sudo mkdir -p /opt/rocm
          sudo tar -xzf ${SDK_COMPILER} -C /opt/rocm
          sudo tar -xzf ${SDK_DEVICE_LIBS} -C /opt/rocm
          sudo tar -xzf ${SDK_CORE_LIBS} -C /opt/rocm
          sudo tar -xzf ${SDK_BLAS} -C /opt/rocm
          sudo tar -xzf ${SDK_MATH} -C /opt/rocm
          /opt/rocm/bin/amdclang --version
          \`\`\`

          Compiler + Core Libs + BLAS (build with BLAS, no sparse/solver):

          \`\`\`bash
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${SDK_COMPILER}
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${SDK_DEVICE_LIBS}
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${SDK_CORE_LIBS}
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${SDK_BLAS}
          sudo mkdir -p /opt/rocm
          sudo tar -xzf ${SDK_COMPILER} -C /opt/rocm
          sudo tar -xzf ${SDK_DEVICE_LIBS} -C /opt/rocm
          sudo tar -xzf ${SDK_CORE_LIBS} -C /opt/rocm
          sudo tar -xzf ${SDK_BLAS} -C /opt/rocm
          \`\`\`

          ## Verification

          \`\`\`bash
          sha256sum -c ${RUNTIME_BUNDLE}.sha256
          sha256sum -c ${SDK_COMPILER}.sha256
          sha256sum -c ${SDK_DEVICE_LIBS}.sha256
          sha256sum -c ${SDK_CORE_LIBS}.sha256
          sha256sum -c ${SDK_BLAS}.sha256
          sha256sum -c ${SDK_MATH}.sha256
          \`\`\`

          ## License

          ROCm libraries are licensed under MIT and Apache 2.0 licenses by AMD.

          ---

          **Note:** This is an unofficial redistribution of ROCm for
          convenience. For official ROCm releases, visit:
          https://github.com/RadeonOpenCompute/ROCm
          EOF

          echo "Release notes generated"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ROCm ${{ needs.build.outputs.rocm_version }} Bundles ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          files: |
            ${{ needs.build.outputs.runtime_bundle }}
            ${{ needs.build.outputs.runtime_bundle }}.sha256
            ${{ needs.build.outputs.sdk_compiler }}
            ${{ needs.build.outputs.sdk_compiler }}.sha256
            ${{ needs.build.outputs.sdk_device_libs }}
            ${{ needs.build.outputs.sdk_device_libs }}.sha256
            ${{ needs.build.outputs.sdk_core_libs }}
            ${{ needs.build.outputs.sdk_core_libs }}.sha256
            ${{ needs.build.outputs.sdk_blas }}
            ${{ needs.build.outputs.sdk_blas }}.sha256
            ${{ needs.build.outputs.sdk_math }}
            ${{ needs.build.outputs.sdk_math }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
