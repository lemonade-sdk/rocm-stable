name: Build and Release ROCm SDK Bundle

on:
  push:
    tags:
      - 'v*'
      - 'b*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release (false = artifacts only for testing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ROCm SDK Package
    runs-on: ubuntu-latest

    outputs:
      rocm_version: ${{ steps.ver.outputs.rocm_version }}
      runtime_bundle: ${{ steps.ver.outputs.runtime_bundle }}
      sdk_bundle: ${{ steps.ver.outputs.sdk_bundle }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "After cleanup:"
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils zstd

      - name: Read ROCm version from build.sh
        id: ver
        run: |
          rocm_version=$(grep '^ROCM_VERSION=' build.sh | cut -d'"' -f2)
          runtime_bundle="rocm-${rocm_version}-runtime-libs.tar.gz"
          sdk_bundle="rocm-${rocm_version}-sdk.tar.gz"
          echo "rocm_version=${rocm_version}" >> $GITHUB_OUTPUT
          echo "runtime_bundle=${runtime_bundle}" >> $GITHUB_OUTPUT
          echo "sdk_bundle=${sdk_bundle}" >> $GITHUB_OUTPUT
          echo "ROCm version: ${rocm_version}"
          echo "Runtime bundle: ${runtime_bundle}"
          echo "SDK bundle:     ${sdk_bundle}"

      - name: Build ROCm runtime + SDK bundles
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify packages were created
        run: |
          runtime="${{ steps.ver.outputs.runtime_bundle }}"
          sdk="${{ steps.ver.outputs.sdk_bundle }}"
          for bundle in "${runtime}" "${sdk}"; do
            if [ ! -f "${bundle}" ]; then
              echo "Error: ${bundle} not found!"
              exit 1
            fi
            echo "Package size: $(du -h ${bundle} | cut -f1) (${bundle})"
          done
          echo "Packages created successfully"

      - name: Generate checksums
        run: |
          runtime="${{ steps.ver.outputs.runtime_bundle }}"
          sdk="${{ steps.ver.outputs.sdk_bundle }}"
          sha256sum "${runtime}" > "${runtime}.sha256"
          sha256sum "${sdk}"     > "${sdk}.sha256"
          cat "${runtime}.sha256" "${sdk}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocm-bundles
          path: |
            ${{ steps.ver.outputs.runtime_bundle }}
            ${{ steps.ver.outputs.runtime_bundle }}.sha256
            ${{ steps.ver.outputs.sdk_bundle }}
            ${{ steps.ver.outputs.sdk_bundle }}.sha256
          retention-days: 5

  verify:
    name: Verify ROCm Bundles
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rocm-bundles

      - name: Report bundle sizes
        run: |
          runtime="${{ needs.build.outputs.runtime_bundle }}"
          sdk="${{ needs.build.outputs.sdk_bundle }}"

          runtime_bytes=$(stat -c%s "${runtime}")
          sdk_bytes=$(stat -c%s "${sdk}")

          echo "Runtime: $(numfmt --to=iec "${runtime_bytes}") (${runtime_bytes} bytes)"
          echo "SDK:     $(numfmt --to=iec "${sdk_bytes}") (${sdk_bytes} bytes)"

      - name: Verify checksums
        run: |
          runtime="${{ needs.build.outputs.runtime_bundle }}"
          sdk="${{ needs.build.outputs.sdk_bundle }}"
          sha256sum -c "${runtime}.sha256"
          sha256sum -c "${sdk}.sha256"

      - name: ldd check -- runtime bundle
        run: |
          runtime="${{ needs.build.outputs.runtime_bundle }}"
          tmpdir=$(mktemp -d)
          tar -xzf "${runtime}" -C "${tmpdir}"

          # Runtime bundle extracts .so files at the root level
          libdir="${tmpdir}"

          export LD_LIBRARY_PATH="${libdir}:${LD_LIBRARY_PATH:-}"

          echo "Checking shared library dependencies..."
          missing=$(find "${libdir}" -name '*.so*' -type f -exec ldd {} \; 2>/dev/null \
            | grep 'not found' \
            | grep -v -E 'libc\.so|libstdc\+\+\.so|libm\.so|libdl\.so|libpthread|librt\.so|libgcc_s\.so|ld-linux|libz\.so|liblzma\.so|libdrm\.so|libnuma\.so|libelf\.so' \
            || true)

          if [ -n "${missing}" ]; then
            echo "::error::Missing shared library dependencies detected:"
            echo "${missing}"
            exit 1
          fi
          echo "ldd check passed -- all runtime dependencies resolved."

          rm -rf "${tmpdir}"

  release:
    name: Create GitHub Release
    needs: [build, verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rocm-bundles

      - name: Extract version from tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "Building release for version: ${GITHUB_REF#refs/tags/}"

      - name: Create release notes
        id: release_notes
        env:
          ROCM_VERSION: ${{ needs.build.outputs.rocm_version }}
          RUNTIME_BUNDLE: ${{ needs.build.outputs.runtime_bundle }}
          SDK_BUNDLE: ${{ needs.build.outputs.sdk_bundle }}
        run: |
          cat > release_notes.md << EOF
          # ROCm ${ROCM_VERSION} Bundles

          Two standalone ROCm ${ROCM_VERSION} bundles pulled from
          https://repo.radeon.com/rocm/apt/${ROCM_VERSION}/ and laid out as
          drop-in replacements for \`/opt/rocm\`.

          - **\`${RUNTIME_BUNDLE}\`** — runtime libraries only. Use this to
            *run* HIP-enabled applications (e.g. llama.cpp ROCm builds).
          - **\`${SDK_BUNDLE}\`** — full SDK: compiler, headers, cmake configs,
            and runtime libraries. Use this to *build* against ROCm.

          ## What's in the runtime bundle

          - libamdhip64 (HIP runtime)
          - libhsa-runtime64 (HSA runtime)
          - libamd_comgr (online kernel compilation manager)
          - rocBLAS, hipBLAS, hipBLASLt (math runtime)
          - rocSPARSE, hipSPARSE, rocSOLVER, hipSOLVER
          - rocRAND, hipRAND
          - openmp-extras-runtime
          - rocprofiler-register, roctracer
          - rocm-smi, rocminfo
          - Filtered Tensile / hipBLASLt GPU kernels for supported gfx targets

          ## What the SDK bundle adds on top

          - **Compiler toolchain**: \`amdclang\` / \`amdclang++\`, \`hipcc\`,
            rocm-llvm, rocm-device-libs, rocm-cmake
          - **Headers**: hip-dev, hsa-rocr-dev, and -dev packages for every
            math/runtime library above
          - **Template libraries (header-only)**: rocPRIM, rocThrust, hipCUB,
            rocWMMA, composable-kernel

          ## System requirements

          - AMD GPU with ROCm support
          - Linux with AMDGPU driver
          - No system ROCm installation required

          ## Quick start

          Runtime only (smaller download, run pre-built ROCm apps):

          \`\`\`bash
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${RUNTIME_BUNDLE}
          sudo mkdir -p /opt/rocm
          sudo tar -xzf ${RUNTIME_BUNDLE} -C /opt/rocm
          \`\`\`

          Full SDK (compile against ROCm):

          \`\`\`bash
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${SDK_BUNDLE}
          sudo mkdir -p /opt/rocm
          sudo tar -xzf ${SDK_BUNDLE} -C /opt/rocm
          /opt/rocm/bin/amdclang --version
          \`\`\`

          ## Verification

          \`\`\`bash
          sha256sum -c ${RUNTIME_BUNDLE}.sha256
          sha256sum -c ${SDK_BUNDLE}.sha256
          \`\`\`

          ## License

          ROCm libraries are licensed under MIT and Apache 2.0 licenses by AMD.

          ---

          **Note:** This is an unofficial redistribution of ROCm for
          convenience. For official ROCm releases, visit:
          https://github.com/RadeonOpenCompute/ROCm
          EOF

          echo "Release notes generated"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ROCm ${{ needs.build.outputs.rocm_version }} Bundles ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          files: |
            ${{ needs.build.outputs.runtime_bundle }}
            ${{ needs.build.outputs.runtime_bundle }}.sha256
            ${{ needs.build.outputs.sdk_bundle }}
            ${{ needs.build.outputs.sdk_bundle }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
