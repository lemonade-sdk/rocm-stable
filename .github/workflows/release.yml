name: Build and Release ROCm SDK Bundle

on:
  push:
    tags:
      - 'v*'
      - 'b*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release (false = artifacts only for testing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ROCm SDK Package
    runs-on: ubuntu-latest

    outputs:
      rocm_version: ${{ steps.ver.outputs.rocm_version }}
      runtime_bundle: ${{ steps.ver.outputs.runtime_bundle }}
      sdk_toolchain: ${{ steps.ver.outputs.sdk_toolchain }}
      sdk_blas: ${{ steps.ver.outputs.sdk_blas }}
      sdk_math: ${{ steps.ver.outputs.sdk_math }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "After cleanup:"
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils zstd

      - name: Read ROCm version from build.sh
        id: ver
        run: |
          rocm_version=$(grep '^ROCM_VERSION=' build.sh | cut -d'"' -f2)
          runtime_bundle="rocm-${rocm_version}-runtime-libs.tar.gz"
          sdk_toolchain="rocm-${rocm_version}-sdk-toolchain.tar.gz"
          sdk_blas="rocm-${rocm_version}-sdk-blas.tar.gz"
          sdk_math="rocm-${rocm_version}-sdk-math.tar.gz"
          echo "rocm_version=${rocm_version}" >> $GITHUB_OUTPUT
          echo "runtime_bundle=${runtime_bundle}" >> $GITHUB_OUTPUT
          echo "sdk_toolchain=${sdk_toolchain}" >> $GITHUB_OUTPUT
          echo "sdk_blas=${sdk_blas}" >> $GITHUB_OUTPUT
          echo "sdk_math=${sdk_math}" >> $GITHUB_OUTPUT
          echo "ROCm version: ${rocm_version}"
          echo "Runtime bundle:  ${runtime_bundle}"
          echo "SDK toolchain:   ${sdk_toolchain}"
          echo "SDK blas:        ${sdk_blas}"
          echo "SDK math:        ${sdk_math}"

      - name: Build ROCm runtime + SDK bundles
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify packages were created
        run: |
          runtime="${{ steps.ver.outputs.runtime_bundle }}"
          sdk_toolchain="${{ steps.ver.outputs.sdk_toolchain }}"
          sdk_blas="${{ steps.ver.outputs.sdk_blas }}"
          sdk_math="${{ steps.ver.outputs.sdk_math }}"
          for bundle in "${runtime}" "${sdk_toolchain}" "${sdk_blas}" "${sdk_math}"; do
            if [ ! -f "${bundle}" ]; then
              echo "Error: ${bundle} not found!"
              exit 1
            fi
            echo "Package size: $(du -h ${bundle} | cut -f1) (${bundle})"
          done
          echo "Packages created successfully"

      - name: Generate checksums
        run: |
          runtime="${{ steps.ver.outputs.runtime_bundle }}"
          sdk_toolchain="${{ steps.ver.outputs.sdk_toolchain }}"
          sdk_blas="${{ steps.ver.outputs.sdk_blas }}"
          sdk_math="${{ steps.ver.outputs.sdk_math }}"
          sha256sum "${runtime}" > "${runtime}.sha256"
          sha256sum "${sdk_toolchain}" > "${sdk_toolchain}.sha256"
          sha256sum "${sdk_blas}"    > "${sdk_blas}.sha256"
          sha256sum "${sdk_math}"    > "${sdk_math}.sha256"
          cat "${runtime}.sha256" "${sdk_toolchain}.sha256" "${sdk_blas}.sha256" "${sdk_math}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocm-bundles
          path: |
            ${{ steps.ver.outputs.runtime_bundle }}
            ${{ steps.ver.outputs.runtime_bundle }}.sha256
            ${{ steps.ver.outputs.sdk_toolchain }}
            ${{ steps.ver.outputs.sdk_toolchain }}.sha256
            ${{ steps.ver.outputs.sdk_blas }}
            ${{ steps.ver.outputs.sdk_blas }}.sha256
            ${{ steps.ver.outputs.sdk_math }}
            ${{ steps.ver.outputs.sdk_math }}.sha256
          retention-days: 5

  verify:
    name: Verify ROCm Bundles
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rocm-bundles

      - name: Report bundle sizes
        run: |
          runtime="${{ needs.build.outputs.runtime_bundle }}"
          sdk_toolchain="${{ needs.build.outputs.sdk_toolchain }}"
          sdk_blas="${{ needs.build.outputs.sdk_blas }}"
          sdk_math="${{ needs.build.outputs.sdk_math }}"

          runtime_bytes=$(stat -c%s "${runtime}")
          toolchain_bytes=$(stat -c%s "${sdk_toolchain}")
          blas_bytes=$(stat -c%s "${sdk_blas}")
          math_bytes=$(stat -c%s "${sdk_math}")

          echo "Runtime:    $(numfmt --to=iec "${runtime_bytes}") (${runtime_bytes} bytes)"
          echo "Toolchain:  $(numfmt --to=iec "${toolchain_bytes}") (${toolchain_bytes} bytes)"
          echo "BLAS:       $(numfmt --to=iec "${blas_bytes}") (${blas_bytes} bytes)"
          echo "Math:       $(numfmt --to=iec "${math_bytes}") (${math_bytes} bytes)"
          echo "SDK total:  $(numfmt --to=iec $((toolchain_bytes + blas_bytes + math_bytes)))"

          # Size gate: 2 GiB per-asset limit
          limit=$((2 * 1024 * 1024 * 1024))
          for name in "Runtime:${runtime}:${runtime_bytes}" "Toolchain:${sdk_toolchain}:${toolchain_bytes}" "BLAS:${sdk_blas}:${blas_bytes}" "Math:${sdk_math}:${math_bytes}"; do
            IFS=: read -r label path bytes <<< "${name}"
            if [ "${bytes}" -gt "${limit}" ]; then
              echo "::error::${label} exceeds 2 GiB limit: $(numfmt --to=iec "${bytes}")"
              exit 1
            fi
            echo "  ${label}: $(numfmt --to=iec "${bytes}") -- within 2 GiB limit"
          done

      - name: Verify checksums
        run: |
          runtime="${{ needs.build.outputs.runtime_bundle }}"
          sdk_toolchain="${{ needs.build.outputs.sdk_toolchain }}"
          sdk_blas="${{ needs.build.outputs.sdk_blas }}"
          sdk_math="${{ needs.build.outputs.sdk_math }}"
          sha256sum -c "${runtime}.sha256"
          sha256sum -c "${sdk_toolchain}.sha256"
          sha256sum -c "${sdk_blas}.sha256"
          sha256sum -c "${sdk_math}.sha256"

      - name: Check no duplicate files across SDK artifacts
        run: |
          sdk_toolchain="${{ needs.build.outputs.sdk_toolchain }}"
          sdk_blas="${{ needs.build.outputs.sdk_blas }}"
          sdk_math="${{ needs.build.outputs.sdk_math }}"

          tmp_tc=$(mktemp -d)
          tmp_bl=$(mktemp -d)
          tmp_ma=$(mktemp -d)

          tar -xzf "${sdk_toolchain}" -C "${tmp_tc}"
          tar -xzf "${sdk_blas}"    -C "${tmp_bl}"
          tar -xzf "${sdk_math}"    -C "${tmp_ma}"

          # Collect relative paths from each artifact
          (cd "${tmp_tc}" && find . -type f | sort) > /tmp/files_tc.txt
          (cd "${tmp_bl}" && find . -type f | sort) > /tmp/files_bl.txt
          (cd "${tmp_ma}" && find . -type f | sort) > /tmp/files_ma.txt

          dup_tc_bl=$(comm -12 /tmp/files_tc.txt /tmp/files_bl.txt)
          dup_tc_ma=$(comm -12 /tmp/files_tc.txt /tmp/files_ma.txt)
          dup_bl_ma=$(comm -12 /tmp/files_bl.txt /tmp/files_ma.txt)

          has_dup=false
          if [ -n "${dup_tc_bl}" ]; then
            echo "::error::Duplicate files between toolchain and blas:"
            echo "${dup_tc_bl}"
            has_dup=true
          fi
          if [ -n "${dup_tc_ma}" ]; then
            echo "::error::Duplicate files between toolchain and math:"
            echo "${dup_tc_ma}"
            has_dup=true
          fi
          if [ -n "${dup_bl_ma}" ]; then
            echo "::error::Duplicate files between blas and math:"
            echo "${dup_bl_ma}"
            has_dup=true
          fi

          rm -rf "${tmp_tc}" "${tmp_bl}" "${tmp_ma}"

          if [ "${has_dup}" = true ]; then
            exit 1
          fi
          echo "No duplicate files across SDK artifacts -- check passed."

      - name: ldd check -- runtime bundle
        run: |
          runtime="${{ needs.build.outputs.runtime_bundle }}"
          tmpdir=$(mktemp -d)
          tar -xzf "${runtime}" -C "${tmpdir}"

          # Runtime bundle extracts .so files at the root level
          libdir="${tmpdir}"

          export LD_LIBRARY_PATH="${libdir}:${LD_LIBRARY_PATH:-}"

          echo "Checking shared library dependencies..."
          missing=$(find "${libdir}" -name '*.so*' -type f -exec ldd {} \; 2>/dev/null \
            | grep 'not found' \
            | grep -v -E 'libc\.so|libstdc\+\+\.so|libm\.so|libdl\.so|libpthread|librt\.so|libgcc_s\.so|ld-linux|libz\.so|liblzma\.so|libdrm\.so|libnuma\.so|libelf\.so' \
            || true)

          if [ -n "${missing}" ]; then
            echo "::error::Missing shared library dependencies detected:"
            echo "${missing}"
            exit 1
          fi
          echo "ldd check passed -- all runtime dependencies resolved."

          rm -rf "${tmpdir}"

  release:
    name: Create GitHub Release
    needs: [build, verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rocm-bundles

      - name: Extract version from tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "Building release for version: ${GITHUB_REF#refs/tags/}"

      - name: Create release notes
        id: release_notes
        env:
          ROCM_VERSION: ${{ needs.build.outputs.rocm_version }}
          RUNTIME_BUNDLE: ${{ needs.build.outputs.runtime_bundle }}
          SDK_TOOLCHAIN: ${{ needs.build.outputs.sdk_toolchain }}
          SDK_BLAS: ${{ needs.build.outputs.sdk_blas }}
          SDK_MATH: ${{ needs.build.outputs.sdk_math }}
        run: |
          cat > release_notes.md << EOF
          # ROCm ${ROCM_VERSION} Bundles

          Four standalone ROCm ${ROCM_VERSION} bundles pulled from
          https://repo.radeon.com/rocm/apt/${ROCM_VERSION}/ and laid out as
          drop-in replacements for \`/opt/rocm\`.

          | Bundle | File | Purpose |
          |--------|------|---------|
          | Runtime | \`${RUNTIME_BUNDLE}\` | Run HIP applications |
          | SDK Toolchain | \`${SDK_TOOLCHAIN}\` | Compiler toolchain, headers, cmake |
          | SDK BLAS | \`${SDK_BLAS}\` | rocBLAS, hipBLAS, hipBLASLt + Tensile kernels |
          | SDK Math | \`${SDK_MATH}\` | rocSPARSE, rocSOLVER, random libs, etc. |

          - **\`${RUNTIME_BUNDLE}\`** — runtime libraries only. Use this to
            *run* HIP-enabled applications (e.g. llama.cpp ROCm builds).
          - **\`${SDK_TOOLCHAIN}\`** — compiler toolchain, headers, cmake.
            Use this to *build* HIP code against ROCm.
          - **\`${SDK_BLAS}\`** — BLAS libraries with Tensile kernels.
            Add this to toolchain for BLAS-enabled builds.
          - **\`${SDK_MATH}\`** — sparse, solver, random libraries.
            Add this alongside BLAS for the complete math SDK.

          Extract all needed bundles to the same directory to get the full tree.

          ## System requirements

          - AMD GPU with ROCm support
          - Linux with AMDGPU driver
          - No system ROCm installation required

          ## Quick start

          Runtime only (smaller download, run pre-built ROCm apps):

          \`\`\`bash
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${RUNTIME_BUNDLE}
          sudo mkdir -p /opt/rocm
          sudo tar -xzf ${RUNTIME_BUNDLE} -C /opt/rocm
          \`\`\`

          Full SDK (compile against ROCm):

          \`\`\`bash
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${SDK_TOOLCHAIN}
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${SDK_BLAS}
          curl -fsSL -O https://github.com/lemonade-sdk/rocm-stable/releases/download/${{ steps.version.outputs.VERSION }}/${SDK_MATH}
          sudo mkdir -p /opt/rocm
          sudo tar -xzf ${SDK_TOOLCHAIN} -C /opt/rocm
          sudo tar -xzf ${SDK_BLAS} -C /opt/rocm
          sudo tar -xzf ${SDK_MATH} -C /opt/rocm
          /opt/rocm/bin/amdclang --version
          \`\`\`

          ## Verification

          \`\`\`bash
          sha256sum -c ${RUNTIME_BUNDLE}.sha256
          sha256sum -c ${SDK_TOOLCHAIN}.sha256
          sha256sum -c ${SDK_BLAS}.sha256
          sha256sum -c ${SDK_MATH}.sha256
          \`\`\`

          ## License

          ROCm libraries are licensed under MIT and Apache 2.0 licenses by AMD.

          ---

          **Note:** This is an unofficial redistribution of ROCm for
          convenience. For official ROCm releases, visit:
          https://github.com/RadeonOpenCompute/ROCm
          EOF

          echo "Release notes generated"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ROCm ${{ needs.build.outputs.rocm_version }} Bundles ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          files: |
            ${{ needs.build.outputs.runtime_bundle }}
            ${{ needs.build.outputs.runtime_bundle }}.sha256
            ${{ needs.build.outputs.sdk_toolchain }}
            ${{ needs.build.outputs.sdk_toolchain }}.sha256
            ${{ needs.build.outputs.sdk_blas }}
            ${{ needs.build.outputs.sdk_blas }}.sha256
            ${{ needs.build.outputs.sdk_math }}
            ${{ needs.build.outputs.sdk_math }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
